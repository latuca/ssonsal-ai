[project]
name = "acappella-transcriber"
version = "0.1.0"
description = "아카펠라 자동 채보: 유튜브 URL/음원 → 성부별 NWC 악보 초안(.nwctxt)"
readme = "README.md"
# Basic Pitch 0.4.0은 Windows + Python 3.10에서 ONNX Runtime 백엔드를 쓴다(3.11부터는 TensorFlow).
# 설치본에 TensorFlow/PyTorch를 넣지 않기 위해 3.10으로 고정한다.
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.10",
    "librosa>=0.10,<0.11",
    "soundfile>=0.12",
    "basic-pitch==0.4.0",
    # basic-pitch → resampy가 pkg_resources를 import한다(setuptools 81에서 제거됨).
    "setuptools>=65,<81",
    "onnxruntime>=1.16",
    "yt-dlp>=2024.10.22",
    "gradio>=4.44,<6",
]

[project.optional-dependencies]
eval = ["mir_eval>=0.7"]

[project.scripts]
acappella = "acappella.pipeline.run:main"
acappella-app = "acappella.app.ui:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mir_eval>=0.7",
]
# 실습실 GPU PC 전용. 앱 설치본에는 들어가지 않는다.
training = [
    "torch>=2.2",
    "onnx>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acappella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: 실제 Basic Pitch/네트워크를 쓰는 느린 테스트 (기본 실행 제외: -m slow로 실행)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
